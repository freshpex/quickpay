# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
#
services:
  - type: web
    name: quickpay-api
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @quickpay/api build
    startCommand: pnpm deploy:start api
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: DATABASE_URL
        sync: false
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: WEB_ORIGIN
        sync: false
      - key: API_ORIGIN
        sync: false
      - key: RUN_WORKER_IN_API
        value: "true"
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        sync: false
      - key: MAILJET_API_KEY
        sync: false
      - key: MAILJET_SECRET_KEY
        sync: false
      - key: MAILJET_FROM_EMAIL
        sync: false
      - key: MAILJET_FROM_NAME
        value: Quick Pay
      - key: PAYMENT_MODE
        value: disabled
      - key: PAYSTACK_TRANSFERS_ENABLED
        value: "false"
      - key: VTPASS_ENV
        value: sandbox
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: VTPASS_API_KEY
        sync: false
      - key: VTPASS_SECRET_KEY
        sync: false
      - key: VTPASS_PUBLIC_KEY
        sync: false
      - key: TERMII_API_KEY
        sync: false
      - key: TERMII_BASE_URL
        sync: false
      - key: TERMII_SENDER_ID
        sync: false
      - key: SMS_ENABLED
        value: "false"
      - key: PUSH_ENABLED
        value: "false"
      - key: EXPO_ACCESS_TOKEN
        sync: false
      - key: UPLOAD_STORAGE
        value: database

  - type: web
    name: quickpay-web
    runtime: node
    region: frankfurt
    plan: free
    buildCommand: corepack enable && corepack prepare pnpm@11.19.0 --activate && pnpm install --frozen-lockfile --prod=false && pnpm --filter @quickpay/web build
    startCommand: pnpm deploy:start web
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: 22.14.0
      - key: API_ORIGIN
        fromService:
          name: quickpay-api
          type: web
          envVarKey: API_ORIGIN
      - key: WEB_ORIGIN
        fromService:
          name: quickpay-api
          type: web
          envVarKey: WEB_ORIGIN

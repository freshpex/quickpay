name: Verify Quick Pay
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: quickpay
          POSTGRES_PASSWORD: local-development-only
          POSTGRES_DB: quickpay
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U quickpay"
          --health-interval 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://quickpay:local-development-only@localhost:5432/quickpay
      PAYMENT_MODE: disabled
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.19.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm setup:local
      - run: pnpm db:migrate
      - run: pnpm db:seed
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm --filter @quickpay/mobile exec expo install --check
      - run: pnpm mobile:export
        env:
          EXPO_PUBLIC_API_URL: https://api.example.invalid/api/v1
          EXPO_PUBLIC_SITE_URL: https://www.example.invalid
      - run: python -m pip install pyyaml==6.0.3 jsonschema==4.25.1
      - run: python scripts/validate-blueprint.py
      - run: pnpm build
        env:
          NEXT_BUILD_DIR: .next-qa
          WEB_ORIGIN: http://localhost:3100
          API_ORIGIN: http://localhost:3101
          NEXT_PUBLIC_SITE_URL: http://localhost:3100
      - run: pnpm exec playwright install --with-deps msedge
      - run: pnpm test:e2e
        env:
          E2E_BASE_URL: http://localhost:3100
          E2E_SERVER_COMMAND: pnpm qa:serve
          E2E_REAL_AUTH: "true"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots
            playwright-report
            test-results
            apps/mobile/dist
